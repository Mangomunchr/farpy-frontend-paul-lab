<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Farpy Benchmark Search</title>
  <link rel="canonical" href="https://farpy.com/benchmark/search" />
  <meta name="description" content="Search public Farpy Benchmark receipts and GPU summaries." />
  <meta property="og:title" content="Farpy Benchmark Search" />
  <meta property="og:description" content="Search public benchmark data generated from real Farpy Benchmark submissions." />
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:24px;background:#070907;color:#f7f1d1}
    main{max-width:900px;margin:auto} a{color:#ffe46b} table{width:100%;border-collapse:collapse}
    th,td{padding:10px;border-bottom:1px solid #283027;text-align:left;vertical-align:top}
    th{font-size:12px;text-transform:uppercase;color:#b9d8c6}.muted{color:#b9d8c6}.err{color:#ffb4a8}
    .bar{display:flex;gap:8px;margin:18px 0}.bar input{flex:1;background:#101311;border:1px solid #283027;border-radius:10px;color:#f7f1d1;padding:10px}
    .bar button{background:#ffe46b;border:0;border-radius:10px;color:#101311;font-weight:700;padding:10px 14px}
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.pill{font-size:12px;text-transform:uppercase;color:#b9d8c6}
    @media (max-width:640px){body{margin:16px}.bar{display:block}.bar button{margin-top:8px;width:100%}}
  </style>
</head>
<body>
  <main>
    <p><a href="/benchmark/leaderboard">Back to leaderboard</a></p>
    <h1>Benchmark search</h1>
    <p class="muted" id="subtitle">Search public receipt-derived benchmark results.</p>
    <form class="bar" id="searchForm">
      <input id="query" name="q" placeholder="Search GPU, CPU, renderer, result id, receipt id..." autocomplete="off" />
      <button type="submit">Search</button>
    </form>
    <table>
      <thead><tr><th>Type</th><th>Result</th><th>Score</th><th>Render</th><th>Samples</th></tr></thead>
      <tbody id="rows"><tr><td colspan="5">Enter a search query.</td></tr></tbody>
    </table>
  </main>
  <script>
    const API_BASE = localStorage.getItem("farpy_leaderboard_api_base") || "/node/v1/leaderboard";
    const unknown = (value) => value === null || value === undefined || value === "" ? "unknown" : value;
    const escapeHtml = (value) => String(unknown(value))
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
    const fmt = (value, digits = 2) => Number.isFinite(Number(value)) ? Number(value).toFixed(digits).replace(/\.00$/, "") : "unknown";
    const fmtSeconds = (value) => Number.isFinite(Number(value)) ? `${fmt(value)}s` : "unknown";

    function readQuery(){
      return new URLSearchParams(location.search).get("q") || "";
    }

    function renderRows(items){
      const rowsEl = document.getElementById("rows");
      rowsEl.innerHTML = items.length ? items.map((item) => {
        const href = item.url || (item.type === "gpu" ? `/benchmark/gpu/${encodeURIComponent(unknown(item.gpu_slug))}` : `/benchmark/result/${encodeURIComponent(unknown(item.result_id))}`);
        return `<tr>
          <td><span class="pill">${escapeHtml(item.type)}</span></td>
          <td><a href="${escapeHtml(href)}">${escapeHtml(item.title)}</a><br><span class="muted">${escapeHtml(item.subtitle)}</span></td>
          <td>${escapeHtml(fmt(item.score))}</td>
          <td>${escapeHtml(fmtSeconds(item.render_seconds))}</td>
          <td>${escapeHtml(item.sample_count)}</td>
        </tr>`;
      }).join("") : '<tr><td colspan="5">No results.</td></tr>';
    }

    async function search(query){
      const subtitle = document.getElementById("subtitle");
      const rowsEl = document.getElementById("rows");
      const trimmed = query.trim();
      document.getElementById("query").value = query;
      if (!trimmed) {
        subtitle.textContent = "Enter a search query.";
        rowsEl.innerHTML = '<tr><td colspan="5">Enter a search query.</td></tr>';
        return;
      }
      try {
        const res = await fetch(`${API_BASE}/search?q=${encodeURIComponent(trimmed)}`, { cache: "no-store" });
        if (!res.ok) throw new Error("search_failed");
        const data = await res.json();
        subtitle.textContent = `${unknown(data.result_count)} result(s) for "${trimmed}"`;
        renderRows(Array.isArray(data.results) ? data.results : []);
      } catch {
        subtitle.textContent = "No fake fallback rows.";
        rowsEl.innerHTML = '<tr><td colspan="5" class="err">Search unavailable.</td></tr>';
      }
    }

    document.getElementById("searchForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const query = document.getElementById("query").value;
      const url = new URL(location.href);
      url.searchParams.set("q", query);
      history.replaceState(null, "", url);
      search(query);
    });
    search(readQuery());
  </script>
</body>
</html>
